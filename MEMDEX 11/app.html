<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memelabs — App</title>
  <link rel="shortcut icon" href="./assets/images/Favicon%201.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #f5a623;
      --gold-dim: rgba(245,166,35,.12);
      --gold-bdr: rgba(245,166,35,.28);
      --bg: #07060a;
      --panel: #0f0d02;
      --text: #fff;
      --muted: rgba(255,255,255,.45);
      --border: rgba(245,166,35,.15);
      --bar-h: 60px;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    .app-bar {
      height: var(--bar-h);
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 16px;
      background: linear-gradient(180deg, #0d0b03, #090800);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      letter-spacing: -.02em;
      flex-shrink: 0;
    }
    .app-brand img { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; }
    .app-brand span { font-size: 16px; }

    /* ── Nav pills ── */
    .app-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 999px;
      padding: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .app-nav::-webkit-scrollbar { display: none; }

    .nav-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: inherit;
      transition: background .15s, color .15s;
    }
    .nav-pill:hover { color: #fff; background: rgba(255,255,255,.05); }
    .nav-pill.active {
      background: linear-gradient(135deg, var(--gold), #d4891a);
      color: #000;
      font-weight: 700;
    }
    .nav-pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor; opacity: .5;
    }
    .nav-pill.active .dot { opacity: 1; }

    /* ── Session chip ── */
    .app-session {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .session-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px 6px 6px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
    }
    .session-chip .avatar {
      width: 24px; height: 24px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #d4891a);
      color: #000;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 11px;
    }
    .session-chip .who { color: #fff; font-weight: 600; }
    .session-chip .wallet { font-family: 'DM Mono', monospace; font-size: 11px; }

    .session-actions { display: flex; gap: 6px; }

    .btn-ghost {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--gold-bdr);
      background: var(--gold-dim);
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, transform .1s;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn-ghost:hover { background: rgba(245,166,35,.2); }
    .btn-ghost:active { transform: scale(.97); }

    .btn-solid {
      padding: 7px 16px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--gold), #d4891a);
      color: #000;
      font-size: 12px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: transform .1s, box-shadow .2s;
      white-space: nowrap;
    }
    .btn-solid:hover { box-shadow: 0 4px 16px rgba(245,166,35,.3); }
    .btn-solid:active { transform: scale(.97); }

    /* ── Viewport ── */
    .app-view {
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
      background: var(--bg);
    }
    .app-view iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--bg);
    }

    .app-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--bg);
      color: var(--muted);
      font-size: 13px;
      z-index: 5;
      transition: opacity .2s;
    }
    .app-loading.hide { opacity: 0; pointer-events: none; }

    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(245,166,35,.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 760px) {
      .app-brand span { display: none; }
      .session-chip .wallet { display: none; }
      .app-bar { gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- ══ APP BAR ══ -->
  <header class="app-bar">
    <a class="app-brand" href="#/market">
      <img src="./assets/images/Memelabs%20Logo%201.png" alt="Memelabs">
      <span>Memelabs</span>
    </a>

    <nav class="app-nav" id="appNav">
      <a class="nav-pill" data-route="market"    href="#/market"><span class="dot"></span>Market</a>
      <a class="nav-pill" data-route="login"     href="#/login"><span class="dot"></span>Pre-login</a>
      <a class="nav-pill" data-route="dashboard" href="#/dashboard"><span class="dot"></span>Dashboard</a>
      <a class="nav-pill" data-route="payment"   href="#/payment"><span class="dot"></span>Payment</a>
    </nav>

    <div class="app-session" id="appSession"></div>
  </header>

  <!-- ══ VIEWPORT ══ -->
  <div class="app-view">
    <div class="app-loading" id="appLoading"><span class="spinner"></span> Loading…</div>
    <iframe id="appFrame" title="Memelabs view" allow="clipboard-write"></iframe>
  </div>

  <script src="./auth.js"></script>
  <script>
    /* ══════════════════════════════════════════════════════════════
       Single entry point.

       Every area of the app is reachable from this one URL via the
       hash, so there is a single link to bookmark / share:

         app.html#/market      public token table
         app.html#/login       pre-login screen
         app.html#/dashboard   authenticated dashboard
         app.html#/payment     crypto payment page
         app.html#/payment?amount=2&token=CVT   custom amounts

       Views render inside an iframe so each page keeps its own CSS
       and JS untouched. Same-origin, so the auth session in
       localStorage is shared between this shell and every view.
       ══════════════════════════════════════════════════════════════ */

    const DEMO_PAYMENT = {
      amount:       '0.9240',
      pairAddress:  '0x21c37681013d088789C6AeD0C0a665cc7b7C1BfB',
      tokens:       '871080.139372',
      chainID:      'solana',
      tokenNameBuy: 'DIH'
    };

    // Which page each route points at.
    const ROUTES = {
      market:    () => 'index.html',
      login:     () => 'login.html',
      signup:    () => 'signup.html',
      dashboard: () => 'dashboard/index.html',
      payment:   (q) => {
        // Allow #/payment?amount=1.5&token=CVT&chain=solana to override the demo trade.
        const get = (k, d) => (q.get(k) || d);
        const p = new URLSearchParams({
          amount:       get('amount', DEMO_PAYMENT.amount),
          pairAddress:  get('pair', DEMO_PAYMENT.pairAddress),
          tokens:       get('tokens', DEMO_PAYMENT.tokens),
          chainID:      get('chain', DEMO_PAYMENT.chainID),
          tokenNameBuy: get('token', DEMO_PAYMENT.tokenNameBuy)
        });
        return 'dashboard/complete.html?' + p.toString();
      }
    };

    const frame    = document.getElementById('appFrame');
    const loading  = document.getElementById('appLoading');
    const sessionEl= document.getElementById('appSession');
    const navEl    = document.getElementById('appNav');

    /** Parse "#/payment?amount=2" into { route, query }. */
    function parseHash() {
      const raw = location.hash.replace(/^#\/?/, '');
      const [route, qs] = raw.split('?');
      return {
        route: ROUTES[route] ? route : null,
        query: new URLSearchParams(qs || '')
      };
    }

    /** Render the active view into the iframe. */
    function render() {
      let { route, query } = parseHash();

      // No / unknown route: send people where they actually belong.
      if (!route) {
        route = Auth.isAuthenticated() ? 'dashboard' : 'login';
        location.replace('#/' + route);
        return;
      }

      frame.src = ROUTES[route](query);
      loading.classList.remove('hide');

      // Highlight the active pill.
      navEl.querySelectorAll('.nav-pill').forEach(p =>
        p.classList.toggle('active', p.dataset.route === route)
      );

      refreshSession();
    }

    /** Header chip: who is signed in, or a sign-in / sign-up pair. */
    function refreshSession() {
      const user = Auth.getCurrentUser();

      if (user) {
        const initial = (user.username || user.email || '?').charAt(0).toUpperCase();
        const wallet  = user.wallet
          ? user.wallet.slice(0, 6) + '...' + user.wallet.slice(-4)
          : '';
        sessionEl.innerHTML = `
          <div class="session-chip">
            <div class="avatar">${initial}</div>
            <div>
              <div class="who">${user.username || user.email}</div>
              ${wallet ? `<div class="wallet">${wallet}</div>` : ''}
            </div>
          </div>
          <div class="session-actions">
            <button class="btn-ghost" id="btnSignOut">Sign out</button>
          </div>`;

        document.getElementById('btnSignOut').onclick = async () => {
          await Auth.logout();
          location.hash = '#/login';
          render();
        };
      } else {
        sessionEl.innerHTML = `
          <div class="session-actions">
            <a class="btn-ghost" href="#/login">Sign in</a>
            <a class="btn-solid" href="#/login">Get started</a>
          </div>`;
      }
    }

    frame.addEventListener('load', () => {
      loading.classList.add('hide');
      // The login/dashboard pages change auth state inside the iframe,
      // so re-read the session every time a view finishes loading.
      refreshSession();
    });

    window.addEventListener('hashchange', render);
    window.addEventListener('storage', refreshSession);

    render();
  </script>
</body>
</html>
