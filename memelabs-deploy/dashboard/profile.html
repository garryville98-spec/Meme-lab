    <div class="sb-footer">
      <div class="sb-user">
        <div class="sb-avatar text-uppper-case" id="sb-avatar"></div>
        <div>
          <div class="sb-username" id="sb-username">
            <svg width="24" height="24" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg" stroke="#f5a623">

              <g class="spinner">
                <circle class="circle" cx="25" cy="25" r="20" fill="none" stroke-width="6"></circle>
              </g>
            </svg>

          </div>
          <div class="sb-wallet" id="sb-wallet">

            <svg width="24" height="6" viewBox="0 0 24 6" xmlns="http://www.w3.org/2000/svg" fill="#f5a623">

              <circle class="dot" cx="3" cy="3" r="3" />
              <circle class="dot dot2" cx="12" cy="3" r="3" />
              <circle class="dot dot3" cx="21" cy="3" r="3" />
            </svg>

          </div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" onclick="toggleSidebar()">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>

      </div>
      <div class="topbar-greeting">Account <span>Settings</span> </div>
    </div>

    <div class="content">
      <div class="profile-header fade-in">
        <div class="profile-pic-large" id="big-avatar">?</div>
        <div class="profile-info">
          <h1 id="display-name">Loading...</h1> <span style="display: none;" id="top_bar_username"></span>
          <p id="display-wallet">0x0000...0000</p>
        </div>
      </div>

      <div class="settings-grid">
        <div class="panel fade-in">
          <div class="panel-header">
            <div class="panel-title">Personal Details</div>
          </div>
          <div style="padding: 24px;">
            <div class="input-group">
              <label>Username</label>
              <input type="text" id="input-username" placeholder="Enter username">
            </div>
            <div class="input-group">
              <label>Email Address</label>
              <input type="email" id="input-email" readonly placeholder="email@example.com">
            </div>
            <button class="btn-save" onclick="updateProfile()">Update Profile</button>
          </div>
        </div>

        <div class="panel fade-in">
          <div class="panel-header">
            <div class="panel-title">Account Stats</div>
          </div>
          <div style="padding: 24px;">
            <div class="pm-item" style="margin-bottom: 15px;">
              <div class="pm-label">Account Age</div>
              <div class="pm-value" id="acc-age">-- days</div>
            </div>
            <!-- <div class="pm-item">
              <div class="pm-label">Total Referrals</div>
              <div class="pm-value" id="ref-count">0</div>
            </div> -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>

    /* ══ SIDEBAR TOGGLE ══ */
    function toggleSidebar() {
      const sb = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");
      const open = sb.classList.toggle("open");
      overlay.style.display = open ? "block" : "none";
    }

  </script>

  <script src="api/profile.js"></script>
  <script src="api/user.js"></script>

</body>
