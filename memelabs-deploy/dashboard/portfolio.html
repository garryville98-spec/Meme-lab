<!DOCTYPE html>
<html lang="en">
<head>
  <title>Memelabs — Portfolio</title>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="assets/images/Favicon&#32;1.png" type="image/x-icon">
    <link rel="stylesheet" href="assets/dashboard.css">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--gold:#f5a623;--gold-dark:#d4891a;--gold-dim:rgba(245,166,35,0.08);--gold-bdr:rgba(245,166,35,0.15);--bg:#07060a;--card:rgba(16,13,2,0.97);--text:#fff;--muted:rgba(255,255,255,0.4);--border:rgba(255,255,255,0.07);--green:#4ade80;--red:#f87171;--sw:240px;}
    html,body{height:100%;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow-x:hidden;}
    .sidebar{width:var(--sw);background:#0a0800;border-right:1px solid var(--gold-bdr);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:200;transition:transform .3s ease;}
    .sb-logo{display:flex;align-items:center;gap:10px;padding:20px 18px;text-decoration:none;border-bottom:1px solid var(--gold-bdr);flex-shrink:0;}
    .sb-logo img{width:32px;height:32px;border-radius:8px;object-fit:cover;}
    .sb-logo span{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.02em;}
    .sb-nav{flex:1;padding:14px 10px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(245,166,35,.15) transparent;}
    .sb-sec{font-size:10px;font-weight:600;color:rgba(255,255,255,.22);text-transform:uppercase;letter-spacing:.1em;padding:0 8px;margin:14px 0 5px;}
    .sb-sec:first-child{margin-top:0;}
    .nav-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;margin-bottom:2px;border:1px solid transparent;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;text-decoration:none;}
    .nav-btn:hover{background:var(--gold-dim);color:var(--text);}
    .nav-btn.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold-bdr);font-weight:600;}
    .nav-btn svg{width:15px;height:15px;flex-shrink:0;}
    .nb-badge{margin-left:auto;background:var(--gold);color:#000;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;}
    .sb-footer{padding:14px 10px;border-top:1px solid var(--gold-bdr);flex-shrink:0;}
    .sb-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--gold-dim);border:1px solid var(--gold-bdr);cursor:pointer;text-decoration:none;}
    .sb-user:hover{border-color:var(--gold);}
    .sb-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#000;flex-shrink:0;}
    .sb-un{font-size:13px;font-weight:600;}
    .sb-wa{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;}
    .main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh;}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:rgba(7,6,10,.97);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);gap:12px;flex-shrink:0;}
    .tb-left{display:flex;align-items:center;gap:10px;}
    .menu-btn{display:none;background:none;border:none;cursor:pointer;color:var(--muted);padding:6px;line-height:0;}
    .tb-greet{font-size:14px;font-weight:600;}
    .tb-greet span{color:var(--gold);}
    .tb-right{display:flex;align-items:center;gap:8px;}
    .notif-btn{position:relative;width:34px;height:34px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s;}
    .notif-btn:hover{border-color:var(--gold-bdr);}
    .notif-dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--gold);border:1px solid var(--bg);}
    .page{padding:24px;animation:fadeIn .25s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    .pg-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;}
    .pg-sub{font-size:14px;color:var(--muted);margin-bottom:24px;}
    .card{background:var(--card);border:1px solid var(--gold-bdr);border-radius:16px;overflow:hidden;transition:border-color .2s;}
    .card:hover{border-color:rgba(245,166,35,.28);}
    .card-pad{padding:20px;}
    .panel-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
    .panel-title{font-size:14px;font-weight:700;}
    .panel-action{font-size:12px;color:var(--gold);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;font-weight:600;padding:0;text-decoration:none;}
    .panel-action:hover{opacity:.7;}
    .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
    .grid-2{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-bottom:20px;}
    .grid-2-eq{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
    .stat-mini{background:var(--card);border:1px solid var(--gold-bdr);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;}
    .stat-mini::before{content:'';position:absolute;top:-30px;left:-30px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(245,166,35,.07) 0%,transparent 70%);pointer-events:none;}
    .sm-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:10px;}
    .sm-icon.g{background:rgba(245,166,35,.15);}.sm-icon.gr{background:rgba(74,222,128,.12);}.sm-icon.b{background:rgba(96,165,250,.12);}.sm-icon.p{background:rgba(139,92,246,.12);}
    .sm-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
    .sm-val{font-size:19px;font-weight:700;letter-spacing:-.01em;}
    .sm-sub{font-size:11px;margin-top:3px;}
    .up{color:var(--green);}.dn{color:var(--red);}
    .port-hero{background:var(--card);border:1px solid var(--gold-bdr);border-radius:18px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden;}
    .port-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(245,166,35,.12) 0%,transparent 65%);pointer-events:none;}
    .ph-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
    .ph-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
    .ph-val{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1;}
    .ph-chg{display:inline-flex;align-items:center;gap:4px;background:rgba(74,222,128,.1);color:var(--green);border:1px solid rgba(74,222,128,.2);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;margin-top:6px;}
    .ph-meta{display:flex;gap:20px;flex-wrap:wrap;}
    .ph-m-lbl{font-size:10px;color:var(--muted);margin-bottom:2px;}
    .ph-m-val{font-size:14px;font-weight:600;}
    .tbl{width:100%;border-collapse:collapse;min-width:500px;}
    .tbl th{font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em;padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);}
    .tbl th:not(:first-child){text-align:right;}
    .tbl td{padding:12px 16px;font-size:13px;color:var(--text);border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle;}
    .tbl td:not(:first-child){text-align:right;}
    .tbl tbody tr:last-child td{border-bottom:none;}
    .tbl tbody tr{transition:background .15s;cursor:pointer;}
    .tbl tbody tr:hover td{background:var(--gold-dim);}
    .tbl-wrap{overflow-x:auto;}
    .coin-cell{display:flex;align-items:center;gap:10px;}
    .c-img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--gold-bdr);flex-shrink:0;}
    .c-name{font-size:13px;font-weight:600;}
    .c-sub{font-size:11px;color:var(--muted);margin-top:1px;}
    .act-item{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.03);transition:background .15s;cursor:pointer;}
    .act-item:last-child{border-bottom:none;}
    .act-item:hover{background:var(--gold-dim);}
    .act-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
    .act-ic.buy{background:rgba(74,222,128,.12);}.act-ic.sell{background:rgba(248,113,113,.12);}.act-ic.earn{background:rgba(245,166,35,.12);}.act-ic.launch{background:rgba(96,165,250,.12);}
    .act-lbl{font-size:13px;font-weight:600;}
    .act-tm{font-size:11px;color:var(--muted);margin-top:1px;}
    .act-amt{font-size:13px;font-weight:700;margin-left:auto;}
    .pos{color:var(--green);}.neg{color:var(--red);}.gld{color:var(--gold);}
    .lb-item{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid rgba(255,255,255,.03);}
    .lb-item:last-child{border-bottom:none;}
    .lb-rank{font-size:13px;font-weight:700;color:var(--muted);width:18px;text-align:center;flex-shrink:0;}
    .lb-rank.gold{color:#f5a623;}.lb-rank.silver{color:#a0a0a0;}.lb-rank.bronze{color:#cd7f32;}
    .lb-img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--gold-bdr);}
    .lb-name{font-size:13px;font-weight:600;flex:1;}
    .lb-val{font-size:13px;font-weight:700;color:var(--gold);}
    .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark));border:none;border-radius:999px;padding:9px 20px;font-size:13px;font-weight:700;font-family:'DM Sans',sans-serif;color:#000;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-block;}
    .btn-gold:hover{transform:translateY(-1px);}
    .btn-outline{background:transparent;border:1px solid rgba(245,166,35,.3);color:var(--gold);font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;padding:6px 14px;border-radius:999px;cursor:pointer;transition:all .15s;}
    .btn-outline:hover{background:var(--gold);color:#000;}
    .btn-red{background:transparent;border:1px solid rgba(248,113,113,.3);color:var(--red);font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;padding:6px 14px;border-radius:999px;cursor:pointer;transition:all .15s;}
    .btn-red:hover{background:var(--red);color:#fff;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
    .form-group{margin-bottom:14px;}
    .form-label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;}
    .form-input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;}
    .form-input:focus{border-color:rgba(245,166,35,.5);}
    .form-input::placeholder{color:rgba(255,255,255,.2);}
    .form-select{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;}
    .form-select option{background:#0a0800;}
    .form-textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;resize:vertical;min-height:90px;}
    .form-textarea::placeholder{color:rgba(255,255,255,.2);}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
    .toggle-row:last-child{border-bottom:none;}
    .tg-info .tg-name{font-size:13px;font-weight:600;}
    .tg-info .tg-desc{font-size:11px;color:var(--muted);margin-top:2px;}
    .toggle{position:relative;width:40px;height:22px;flex-shrink:0;}
    .toggle input{opacity:0;width:0;height:0;}
    .toggle-slider{position:absolute;inset:0;background:rgba(255,255,255,.1);border-radius:999px;cursor:pointer;transition:.3s;}
    .toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;background:rgba(255,255,255,.5);border-radius:50%;transition:.3s;}
    .toggle input:checked+.toggle-slider{background:var(--gold);}
    .toggle input:checked+.toggle-slider::before{transform:translateX(18px);background:#000;}
    .avatar-upload{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
    .av-circle{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#000;flex-shrink:0;cursor:pointer;border:2px solid var(--gold-bdr);}
    .av-info .av-name{font-size:15px;font-weight:700;}
    .av-info .av-email{font-size:12px;color:var(--muted);margin-top:2px;}
    .av-info .av-btn{font-size:12px;color:var(--gold);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;font-weight:600;padding:0;margin-top:6px;display:block;}
    .wizard-steps{display:flex;gap:0;margin-bottom:24px;background:var(--card);border:1px solid var(--gold-bdr);border-radius:12px;overflow:hidden;}
    .wz-step{flex:1;padding:14px 10px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-right:1px solid var(--border);transition:all .2s;}
    .wz-step:last-child{border-right:none;}
    .wz-step.active{background:var(--gold-dim);color:var(--gold);}
    .wz-step.done{color:var(--green);}
    .wz-num{font-size:16px;font-weight:800;margin-bottom:2px;}
    .ref-card{background:linear-gradient(135deg,rgba(245,166,35,.12),rgba(212,137,26,.06));border:1px solid var(--gold-bdr);border-radius:16px;padding:20px;margin-bottom:16px;}
    .ref-link-wrap{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:1px solid var(--gold-bdr);border-radius:10px;padding:10px 14px;margin-top:12px;}
    .ref-link{flex:1;font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .copy-btn{background:var(--gold);border:none;color:#000;font-size:11px;font-weight:700;font-family:'DM Sans',sans-serif;padding:5px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:199;}
    @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}
    @media(max-width:900px){:root{--sw:0px;}.sidebar{transform:translateX(-240px);width:240px;}.sidebar.open{transform:translateX(0);}.overlay{display:block;}.main{margin-left:0;}.menu-btn{display:flex;}.page{padding:16px;}.topbar{padding:12px 16px;}}
    @media(max-width:600px){.grid-4{grid-template-columns:1fr 1fr;}.grid-2-eq{grid-template-columns:1fr;}.ph-val{font-size:26px;}.form-row{grid-template-columns:1fr;}.wizard-steps{flex-wrap:wrap;}.wz-step{min-width:50%;}}
    @media(max-width:420px){.grid-4{grid-template-columns:1fr;}}
</style>
</head>

<script>

async function getLivePrice(chainId = 'solana', pairAddress) {
try {
        // Using the Pair API endpoint
        const url = `https://api.dexscreener.com/latest/dex/pairs/${chainId}/${pairAddress}`;
        const response = await fetch(url);
        const data = await response.json();

        // The Pair API returns the data under the 'pair' key
        if (data && data.pair) {
            const p = data.pair;
            
            return {
                price: parseFloat(p.priceUsd),
                // Accessing the nested priceChange object correctly
                change: p.priceChange?.h24 || 0,
                url: p.url
            };
        }
    } catch (e) {
        console.error(`DexScreener API error for ${token.name}:`, e);
    }
    
    // Return default if something goes wrong
    
    return { price: 0, change: 0, url: "#" };
}

const coinRow = (h, liveData) => {


    function formatCryptoPrice(price) {
    // 1. Convert to a number (API data is usually a string)
    const num = parseFloat(price);

    // 2. Use Intl.NumberFormat for clean, accurate display
    return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        // 'maximumSignificantDigits' is the key here. 
        // It shows up to 6 non-zero digits, handling tiny numbers automatically.
        maximumSignificantDigits: 6,
        minimumFractionDigits: 2 // Keeps it looking like currency even for small values
    }).format(num);
}
    const balance = h.tokens * (liveData.price || 0); // Assuming 'balance' is the number of tokens, multiply by live price for USD value
    const livePrice = liveData.price || 0;
    const change = liveData.change || 0;
    const changeClass = change >= 0 ? "up" : "down";
    const arrow = change >= 0 ? "↑" : "↓";

    return `
    <tr>
        <td>
            <div class="u-cell">
                <div class="u-av">${h.token_name[0].toUpperCase()}</div>
                <div>
                    <div class="u-name">${h.token_name}</div>
                    <div class="u-sub">Asset</div>
                </div>
            </div>
        </td>
        <td style="font-family: 'DM Mono', monospace;">${formatCryptoPrice(livePrice)}</td> 
        <td style="font-weight: 600;">${formatCryptoPrice(balance)}</td>
        <td><span class="${changeClass}">${arrow} ${Math.abs(change)}%</span></td>
        <td style="text-align: right;">
            <div class="action-group">
                <a href="${liveData.url}" target="_blank" class="btn-icon view btn-trade-now" style="text-decoration:none"> Live Data 📊</a>
            </div>
        </td>
    </tr>`;
};

        return { ...h, live };

    const totalVolume = enrichedHoldings.reduce((sum, item) => {
        const tokenBalance = parseFloat(item.tokens) || 0;
        const livePrice = parseFloat(item.live.price) || 0;
        return sum + (tokenBalance * livePrice);
    }, 0);

//  document.getElementById("totalSpent").textContent  = totalVolume.toLocaleString(undefined, {minimumFractionDigits: 2}) + 'SOL';
  document.getElementById("portfolioValue").textContent  = "$" + totalVolume.toLocaleString(undefined, {minimumFractionDigits: 2});
    // Render Table
    ht.innerHTML = `
         <thead><tr><th>Token</th><th>Price</th><th>Balance</th><th>24h</th><th></th></tr></thead>
        <tbody>
            ${enrichedHoldings.map(item => coinRow(item, item.live)).join('')}
        </tbody>`;

    // Also update the top "Portfolio Value" with the live prices
    document.getElementById("holdingsEmpty").style.display = enrichedHoldings.length > 0 ? "none" : "block";
    const totalLiveValue = enrichedHoldings.reduce((sum, item) => sum + (item.balance * item.live.price), 0);

}
